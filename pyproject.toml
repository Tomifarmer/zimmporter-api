[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "zimmporter-master"
dynamic = ["version"]
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3,<6.0",
    "fastapi>=0.162.0,<1.0",
    "boto3>=1.43.123",
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "mutagen>=1.48.1",
    "pydantic>=2.14.2,<3.0",
    "PyJWT[crypto]>=2.15.1,<3.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6,<3.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8.0",
    "ytmusicapi>=1.12.3",
]

[tool.ruff]

# Longueur de ligne (88 = défaut de Black)
line-length = 120

# Dossiers à ignorer
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Règles à activer
select = [
    "E",      # Erreurs de style pycodestyle
    "F",      # Erreurs Pyflakes (variables non utilisées, etc.)
    "I",      # Tri des imports (isort)
    "B",      # Bugs potentiels (flake8-bugbear)
    "UP",     # Modernisation syntaxe (pyupgrade)
    "SIM",    # Simplifications possibles
]

# Règles à ignorer
ignore = [
    "E501",   # Ligne trop longue (géré par le formatter)
]

# Règles que --fix peut corriger automatiquement
fixable = ["ALL"]

[tool.ruff.format]
# Style des guillemets (comme Black)
quote-style = "double"

# Indentation (comme Black)
indent-style = "space"

[tool.setuptools.packages.find]
include = ["zimmporter*", "api*", "db*", "tasks*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]
