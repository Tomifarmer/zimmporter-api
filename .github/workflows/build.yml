name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
      - run: uv sync --frozen
      - run: uv run python -m pytest tests/ -v

  api:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [alpine, debian]
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant == 'alpine' }}
            type=raw,value=alpine
            type=semver,pattern={{version}},enable=${{ matrix.variant == 'alpine' }}
            type=semver,pattern={{version}},suffix=-debian,enable=${{ matrix.variant == 'debian' }}
            type=raw,value=debian,enable=${{ matrix.variant == 'debian' }}
            type=ref,event=pr,suffix=-${{ matrix.variant }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant == 'alpine' && 'Dockerfile.alpine' || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ matrix.variant }}
          severity: CRITICAL,HIGH
          exit-code: 1
