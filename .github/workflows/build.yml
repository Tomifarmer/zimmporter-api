name: Build and Push

on:
  push:
    branches: [main, feature/*]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - run: uv sync --frozen
      - run: uv run python -m pytest tests/ -v

  build:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/feature/'))
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
        variant: [alpine, debian]
    steps:
      - uses: actions/checkout@v7

      - name: Set build metadata
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REPO_LOWER=${OWNER}/zimmporter-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cat > zimmporter/_version.py <<EOF
          __version__ = "$VERSION"
          EOF
          sed -i "s/dynamic = \[\\\"version\\\"\]/version = \"$VERSION\"/" pyproject.toml

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}
          tags: |
            type=raw,value=${{ matrix.variant }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'alpine' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'alpine' }}
            type=semver,pattern={{version}},suffix=-alpine,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'alpine' }}
            type=semver,pattern={{version}},suffix=-debian,enable=${{ startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'debian' }}
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=ref,event=pr,suffix=-${{ matrix.variant }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ (matrix.target == 'api' && matrix.variant == 'alpine') && 'Dockerfile.alpine' || (matrix.target == 'api' && matrix.variant == 'debian') && 'Dockerfile' || (matrix.target == 'worker' && matrix.variant == 'alpine') && 'Dockerfile.worker.alpine' || 'Dockerfile.worker' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ matrix.variant }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
