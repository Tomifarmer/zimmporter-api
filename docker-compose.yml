---

services:
  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=zimmporter
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER=redis://valkey:6379/0
      - CELERY_BACKEND=redis://valkey:6379/1
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=zimmporter
    env_file:
      - .env.local
    volumes:
      - zimmer_data:/data/zimmer/importer
    depends_on:
      valkey:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.alpine
    environment:
      - CELERY_BROKER=redis://valkey:6379/0
      - CELERY_BACKEND=redis://valkey:6379/1
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=zimmporter
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test123456789
      - AWS_ENDPOINT_URL=http://192.168.2.250:9000
      - AWS_USE_SSL=false
      - AWS_BUCKET=test
      - AWS_DEFAULT_REGION=us-east-1
      - POT_PROVIDER_URL=http://bgutil-provider:4416
      - YTDLP_COOKIEFILE=/etc/zimmporter/cookies.txt
    volumes:
      - zimmer_data:/data/zimmer/importer
      - ./cookies.txt:/etc/zimmporter/cookies.txt:ro
    depends_on:
      bgutil-provider:
        condition: service_started
      valkey:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4", "--pool=prefork"]

volumes:
  valkey_data:
  mariadb_data:
  zimmer_data:
